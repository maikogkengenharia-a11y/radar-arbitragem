name: Robô de arbitragem (simulação 24h)

# A cada 5 minutos, chama a checagem do robô na Vercel por ~4,5 min (uma vez a cada 15 s).
# O robô em si (preços, compra, venda, saldos) roda e fica salvo na Vercel.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checar oportunidades por ~4,5 minutos
        run: |
          fim=$(( $(date +%s) + 270 ))
          while [ $(date +%s) -lt $fim ]; do
            curl -s -m 25 "https://radar-arbitragem.vercel.app/api/tick" || true
            echo
            sleep 15
          done
